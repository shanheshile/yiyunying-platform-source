location = /download-center {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    return 302 /download-center/?refresh=$msec;
}

location ^~ /download-center/ {
    root /www/wwwroot/appht.jjmxg.xyz/yiyunying-backend/public;
    index index.html;
    charset utf-8;
    try_files $uri $uri/ =404;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Stable customer aliases use /downloads/X.Y.Z/. Lifecycle policies use an
# immutable, publisher-generated /downloads/X.Y.Z-<24 lowercase hex>/ path.
# Both paths expose only the four production APK names; every other download
# object falls through to the 404 prefix below.
location ~ ^/downloads/(?<release_version>[0-9]+\.[0-9]+\.[0-9]+)(?:-[0-9a-f]{24})?/yiyunying-(?:user|admin|authorized-platform|platform-owner)-v\k<release_version>\.apk$ {
    root /www/wwwroot/appht.jjmxg.xyz/yiyunying-backend/public;
    types {
        application/vnd.android.package-archive apk;
    }
    default_type application/vnd.android.package-archive;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /downloads {
    return 404;
}

location /downloads/ {
    return 404;
}
