plugins {
    id 'com.android.application'
}

def versionPropertiesFile = rootProject.file('version.properties')
if (!versionPropertiesFile.isFile()) {
    throw new GradleException("Missing version.properties at ${versionPropertiesFile}")
}

def versionProperties = new Properties()
versionPropertiesFile.withInputStream { stream -> versionProperties.load(stream) }
def appVersionName = versionProperties.getProperty('VERSION_NAME')?.trim()
def versionCodeValue = versionProperties.getProperty('VERSION_CODE')?.trim()
if (!(appVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('VERSION_NAME must use major.minor.patch format')
}
if (!(versionCodeValue ==~ /[1-9]\d*/)) {
    throw new GradleException('VERSION_CODE must be a positive integer')
}
def appVersionCode = versionCodeValue.toInteger()

def strictLegacyCompatIdentity = System.getenv('YIYUNYING_LEGACY_COMPAT_STRICT') == '1'
def legacyConnectionProperties = ['appKey', 'platformKey', 'authorizedPlatformKey'] as Set
def configValue = { String propertyName, String environmentName, String fallback ->
    if (strictLegacyCompatIdentity && legacyConnectionProperties.contains(propertyName)) {
        def environmentValue = System.getenv(environmentName)
        if (environmentValue == null) {
            throw new GradleException("Strict legacy compatibility identity is missing ${environmentName}")
        }
        return environmentValue.toString()
    }
    (project.findProperty(propertyName) ?: System.getenv(environmentName) ?: fallback).toString()
}
def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def officialHostedApiBaseUrl = 'https://appht.jjmxg.xyz/'
def readOptionalConfiguration = { String propertyName, String environmentName ->
    def propertyValue = project.findProperty(propertyName)
    if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
        return propertyValue.toString().trim()
    }
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null && !environmentValue.toString().trim().isEmpty()) {
        return environmentValue.toString().trim()
    }
    return null
}
def normalizeConnectionMode = { String raw ->
    def value = (raw ?: 'hosted').trim().toLowerCase(Locale.ROOT).replace('-', '_')
    if (!(value in ['hosted', 'self_host'])) {
        throw new GradleException('connectionMode/YIYUNYING_CONNECTION_MODE 只支持 hosted 或 self_host。')
    }
    value
}
def parseExplicitBoolean = { String raw, String label ->
    if (raw == null) return false
    def value = raw.trim().toLowerCase(Locale.ROOT)
    if (value in ['1', 'true']) return true
    if (value in ['0', 'false']) return false
    throw new GradleException("${label} 只支持 true/false 或 1/0。")
}
def normalizeApiEndpoint = { String raw, boolean allowHttp ->
    def value = raw == null ? '' : raw.trim()
    if (value.isEmpty()) {
        throw new GradleException('API 线路不能为空。')
    }
    if (!(value ==~ /(?i)^https?:\/\/.+/)) {
        throw new GradleException("API 线路必须显式包含 http:// 或 https://：${value}")
    }
    URI uri
    try {
        uri = new URI(value)
    } catch (URISyntaxException exception) {
        throw new GradleException("API 线路格式错误：${value}")
    }
    def scheme = uri.scheme == null ? '' : uri.scheme.toLowerCase(Locale.ROOT)
    if (!(scheme in ['http', 'https']) || uri.host == null || uri.host.trim().isEmpty()) {
        throw new GradleException("API 线路只支持带有效主机名的 HTTP/HTTPS 地址：${value}")
    }
    if (scheme == 'http' && !allowHttp) {
        throw new GradleException('HTTP 线路默认禁止；仅源码买断自建模式可显式设置 allowHttpEndpoints=true。')
    }
    if (uri.userInfo != null || uri.query != null || uri.fragment != null) {
        throw new GradleException("API 线路不能包含账号、查询参数或片段：${value}")
    }
    def port = uri.port
    if ((scheme == 'https' && port == 443) || (scheme == 'http' && port == 80)) port = -1
    def path = uri.path == null || uri.path.isEmpty() ? '/' : uri.path
    URI normalizedUri
    try {
        normalizedUri = new URI(scheme, null, uri.host.toLowerCase(Locale.ROOT), port, path, null, null).normalize()
    } catch (URISyntaxException exception) {
        throw new GradleException("API 线路无法规范化：${value}")
    }
    def normalized = normalizedUri.toASCIIString()
    normalized.endsWith('/') ? normalized : normalized + '/'
}
def normalizeApiEndpoints = { String raw, boolean allowHttp ->
    def result = new LinkedHashSet<String>()
    (raw ?: '').split(/[;,\r\n]+/).each { candidate ->
        if (!candidate.trim().isEmpty()) result.add(normalizeApiEndpoint(candidate, allowHttp))
    }
    if (result.isEmpty()) {
        throw new GradleException('至少需要配置一条 API 线路。')
    }
    result.toList()
}

def configuredApiBaseUrlsRaw = readOptionalConfiguration('apiBaseUrls', 'YIYUNYING_API_BASE_URLS')
def configuredApiBaseUrlRaw = readOptionalConfiguration('apiBaseUrl', 'YIYUNYING_API_BASE_URL')
def configuredConnectionModeRaw = readOptionalConfiguration('connectionMode', 'YIYUNYING_CONNECTION_MODE')
def configuredAllowHttpRaw = readOptionalConfiguration('allowHttpEndpoints', 'YIYUNYING_ALLOW_HTTP_ENDPOINTS')
def connectionMode = normalizeConnectionMode(configuredConnectionModeRaw)
def allowHttpEndpoints = parseExplicitBoolean(configuredAllowHttpRaw, 'allowHttpEndpoints/YIYUNYING_ALLOW_HTTP_ENDPOINTS')
def hasExplicitApiEndpoints = configuredApiBaseUrlsRaw != null || configuredApiBaseUrlRaw != null
def apiBaseUrlsRaw = configuredApiBaseUrlsRaw ?: configuredApiBaseUrlRaw ?: officialHostedApiBaseUrl
def apiBaseUrls = normalizeApiEndpoints(apiBaseUrlsRaw, allowHttpEndpoints)

if (configuredApiBaseUrlsRaw != null && configuredApiBaseUrlRaw != null) {
    def legacySingle = normalizeApiEndpoint(configuredApiBaseUrlRaw, allowHttpEndpoints)
    if (legacySingle != apiBaseUrls.first()) {
        throw new GradleException('apiBaseUrl 与 apiBaseUrls 第一条线路不一致，拒绝含糊的连接身份。')
    }
}
if (connectionMode == 'hosted') {
    if (allowHttpEndpoints || apiBaseUrls != [officialHostedApiBaseUrl]) {
        throw new GradleException("hosted 官方模式只允许唯一线路 ${officialHostedApiBaseUrl}，且绝不允许 HTTP 降级。")
    }
} else {
    if (!hasExplicitApiEndpoints) {
        throw new GradleException('self_host 源码买断模式必须显式配置自己的 apiBaseUrl/apiBaseUrls。')
    }
    if (apiBaseUrls.any { new URI(it).host.equalsIgnoreCase('appht.jjmxg.xyz') }) {
        throw new GradleException('self_host 源码买断模式不得依赖官方 appht.jjmxg.xyz，请配置买方自己的服务器。')
    }
}

def defaultApiBaseUrl = apiBaseUrls.first()
def encodedApiBaseUrls = apiBaseUrls.join(';')
def enableApiFailover = connectionMode == 'self_host' && apiBaseUrls.size() > 1
def implicitLocalDebug = configuredConnectionModeRaw == null && !hasExplicitApiEndpoints && configuredAllowHttpRaw == null
def debugApiBaseUrls = implicitLocalDebug ? ['http://10.0.2.2:8788/'] : apiBaseUrls
def debugConnectionMode = implicitLocalDebug ? 'self_host' : connectionMode
def debugAllowHttpEndpoints = implicitLocalDebug || allowHttpEndpoints
def debugEnableApiFailover = debugConnectionMode == 'self_host' && debugApiBaseUrls.size() > 1
def defaultAppKey = configValue('appKey', 'YIYUNYING_APP_KEY', 'yiyunying-local')
def defaultPlatformKey = configValue('platformKey', 'YIYUNYING_PLATFORM_KEY', 'local-platform')
def authorizedPlatformKey = configValue(
        'authorizedPlatformKey',
        'YIYUNYING_AUTHORIZED_PLATFORM_KEY',
        'local-authorized-platform'
)

// Stable signing material is deliberately available only through the process
// environment. Never add Gradle-property or source-controlled fallbacks here.
def releaseSigningEnvironment = [
        storeFile: System.getenv('YIYUNYING_RELEASE_STORE_FILE'),
        storePassword: System.getenv('YIYUNYING_RELEASE_STORE_PASSWORD'),
        keyAlias: System.getenv('YIYUNYING_RELEASE_KEY_ALIAS'),
        keyPassword: System.getenv('YIYUNYING_RELEASE_KEY_PASSWORD')
]
def releaseSigningComplete = releaseSigningEnvironment.values().every { it != null && !it.trim().isEmpty() }

tasks.register('printVersion') {
    group = 'versioning'
    description = 'Prints the shared application version without building an APK.'
    doLast { println "${appVersionName} (${appVersionCode})" }
}

android {
    namespace 'xyz.jjmxg.yiyunying'
    compileSdk 36

    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'xyz.jjmxg.yiyunying'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            if (project.findProperty('includeEmulatorAbi') == 'true') {
                abiFilters 'x86_64'
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [
            networkSecurityConfig: allowHttpEndpoints
                ? '@xml/network_security_config_http_opt_in'
                : '@xml/network_security_config'
        ]
        buildConfigField 'String', 'DEFAULT_API_BASE_URL', asBuildConfigString(defaultApiBaseUrl)
        buildConfigField 'String', 'API_BASE_URLS', asBuildConfigString(encodedApiBaseUrls)
        buildConfigField 'String', 'CONNECTION_MODE', asBuildConfigString(connectionMode)
        buildConfigField 'boolean', 'ENABLE_API_FAILOVER', enableApiFailover.toString()
        buildConfigField 'boolean', 'ALLOW_HTTP_ENDPOINTS', allowHttpEndpoints.toString()
        buildConfigField 'String', 'DEFAULT_APP_KEY', asBuildConfigString(defaultAppKey)
        buildConfigField 'String', 'DEFAULT_PLATFORM_KEY', asBuildConfigString(defaultPlatformKey)
    }

    flavorDimensions += 'edition'
    productFlavors {
        platformOwner {
            dimension 'edition'
            applicationIdSuffix '.platformowner'
            versionNameSuffix '-platform-owner'
            buildConfigField 'String', 'APP_EDITION', '"platform_owner"'
            buildConfigField 'String', 'FIXED_ROLE', '"platform"'
            buildConfigField 'int', 'REQUIRED_PLATFORM_LEVEL', '1'
            buildConfigField 'boolean', 'ALLOW_SELF_REGISTER', 'false'
            buildConfigField 'String', 'DEFAULT_ACCOUNT', '"root"'
            resValue 'string', 'app_name', '易运盈平台总控'
            resValue 'string', 'login_title', '登录平台总控'
            resValue 'string', 'login_subtitle', '仅限一级平台所有者使用'
        }
        authorizedPlatform {
            dimension 'edition'
            applicationIdSuffix '.authorized'
            versionNameSuffix '-authorized-platform'
            buildConfigField 'String', 'APP_EDITION', '"authorized_platform"'
            buildConfigField 'String', 'FIXED_ROLE', '"platform"'
            buildConfigField 'int', 'REQUIRED_PLATFORM_LEVEL', '2'
            buildConfigField 'boolean', 'ALLOW_SELF_REGISTER', 'false'
            buildConfigField 'String', 'DEFAULT_ACCOUNT', '"authorized"'
            buildConfigField 'String', 'DEFAULT_PLATFORM_KEY', asBuildConfigString(authorizedPlatformKey)
            resValue 'string', 'app_name', '易运盈授权平台'
            resValue 'string', 'login_title', '登录授权平台'
            resValue 'string', 'login_subtitle', '仅限已授权的二级平台使用'
        }
        admin {
            dimension 'edition'
            applicationIdSuffix '.admin'
            versionNameSuffix '-admin'
            buildConfigField 'String', 'APP_EDITION', '"admin"'
            buildConfigField 'String', 'FIXED_ROLE', '"admin"'
            buildConfigField 'int', 'REQUIRED_PLATFORM_LEVEL', '0'
            buildConfigField 'boolean', 'ALLOW_SELF_REGISTER', 'true'
            buildConfigField 'String', 'DEFAULT_ACCOUNT', '"admin"'
            resValue 'string', 'app_name', '易运盈管理员'
            resValue 'string', 'login_title', '登录管理员后台'
            resValue 'string', 'login_subtitle', '管理自己的应用、用户与内容'
        }
        user {
            dimension 'edition'
            applicationIdSuffix '.user'
            versionNameSuffix '-user'
            buildConfigField 'String', 'APP_EDITION', '"user"'
            buildConfigField 'String', 'FIXED_ROLE', '"user"'
            buildConfigField 'int', 'REQUIRED_PLATFORM_LEVEL', '0'
            buildConfigField 'boolean', 'ALLOW_SELF_REGISTER', 'true'
            buildConfigField 'String', 'DEFAULT_ACCOUNT', '"user"'
            resValue 'string', 'app_name', '易运盈用户端'
            resValue 'string', 'login_title', '登录易运盈用户端'
            resValue 'string', 'login_subtitle', '使用所属应用提供的消息与社区服务'
        }
    }

    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'DEFAULT_API_BASE_URL', asBuildConfigString(debugApiBaseUrls.first())
            buildConfigField 'String', 'API_BASE_URLS', asBuildConfigString(debugApiBaseUrls.join(';'))
            buildConfigField 'String', 'CONNECTION_MODE', asBuildConfigString(debugConnectionMode)
            buildConfigField 'boolean', 'ENABLE_API_FAILOVER', debugEnableApiFailover.toString()
            buildConfigField 'boolean', 'ALLOW_HTTP_ENDPOINTS', debugAllowHttpEndpoints.toString()
            manifestPlaceholders = [
                networkSecurityConfig: debugAllowHttpEndpoints
                    ? '@xml/network_security_config_http_opt_in'
                    : '@xml/network_security_config'
            ]
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        legacyCompat {
            // Coverage update for the four historical *.debug package names.
            // It deliberately inherits Release hardening, never src/debug, while
            // retaining the legacy Android debug certificate for installability.
            initWith release
            debuggable false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'DEFAULT_API_BASE_URL', asBuildConfigString('https://appht.jjmxg.xyz/')
            buildConfigField 'String', 'API_BASE_URLS', asBuildConfigString('https://appht.jjmxg.xyz/')
            buildConfigField 'String', 'CONNECTION_MODE', asBuildConfigString('hosted')
            buildConfigField 'boolean', 'ENABLE_API_FAILOVER', 'false'
            buildConfigField 'boolean', 'ALLOW_HTTP_ENDPOINTS', 'false'
            manifestPlaceholders = [networkSecurityConfig: '@xml/network_security_config']
            signingConfig signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

tasks.register('printConnectionConfig') {
    group = 'verification'
    description = 'Prints the normalized non-secret Release connection profile.'
    doLast {
        println "mode=${connectionMode}"
        println "apiBaseUrls=${encodedApiBaseUrls}"
        println "allowHttpEndpoints=${allowHttpEndpoints}"
        println "enableApiFailover=${enableApiFailover}"
    }
}

def validateReleaseSigningEnvironment = tasks.register('validateReleaseSigningEnvironment') {
    group = 'verification'
    description = 'Fails closed unless all Stable signing environment variables and the keystore are present.'
    doLast {
        def missing = releaseSigningEnvironment.findAll { _, value -> value == null || value.trim().isEmpty() }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException('Stable Release signing environment is incomplete. Missing: ' + missing.join(', '))
        }
        def keystore = file(releaseSigningEnvironment.storeFile)
        if (!keystore.isFile()) {
            throw new GradleException('Stable Release keystore does not exist or is not a regular file.')
        }
    }
}

// Debug tasks remain usable without production secrets. Any APK/AAB Release
// packaging graph is explicitly gated before Android signing can run.
tasks.configureEach { task ->
    if (task.name ==~ /(?i)^(assemble|bundle|package).*Release$/) {
        task.dependsOn(validateReleaseSigningEnvironment)
    }
}

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    forkEvery = 24
    maxHeapSize = (project.findProperty('unitTestMaxHeap')
        ?: System.getenv('YIYUNYING_UNIT_TEST_MAX_HEAP')
        ?: '1536m').toString()
    if (project.findProperty('lowMemoryTests')?.toString() == 'true') {
        jvmArgs '-XX:+UseSerialGC', '-XX:MaxMetaspaceSize=192m', '-Xss512k'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.media3:media3-common:1.10.1'
    implementation 'androidx.media3:media3-effect:1.10.1'
    implementation 'androidx.media3:media3-transformer:1.10.1'
    implementation 'io.github.webrtc-sdk:android:144.7559.05'
    userImplementation 'net.java.dev.jna:jna:5.18.1@aar'
    userImplementation 'com.alphacephei:vosk-android:0.3.75@aar'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

// JDK 17 on a Chinese Windows locale can misread Gradle test-worker argument
// files when the project path contains non-ASCII characters. Use an ASCII
// pathing JAR for the worker classpath in that case.
if (!(rootProject.projectDir.absolutePath ==~ /\p{ASCII}*/)) {
    tasks.withType(Test).configureEach { testTask ->
        doFirst {
            def originalClasspath = testTask.classpath.files.findAll { it.exists() }
            def pathingDir = new File(System.getProperty('user.home'), '.gradle/yiyunying-test-classpath')
            if (!pathingDir.exists() && !pathingDir.mkdirs()) {
                throw new GradleException("Unable to create test classpath directory: ${pathingDir}")
            }
            def safeName = "${rootProject.name}-${project.name}-${testTask.name}"
                    .replaceAll(/[^A-Za-z0-9._-]/, '_')
            def pathingJar = new File(pathingDir, "${safeName}.jar")
            def manifest = new java.util.jar.Manifest()
            manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
            manifest.mainAttributes.putValue(
                    'Class-Path',
                    originalClasspath.collect { it.toURI().toASCIIString() }.join(' ')
            )
            pathingJar.withOutputStream { output ->
                new java.util.jar.JarOutputStream(output, manifest).close()
            }
            testTask.classpath = project.files(pathingJar)
        }
    }
}
